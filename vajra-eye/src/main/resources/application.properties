server.port=8088
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# MySQL Workbench: host localhost, user root, password root, schema vajra_eye
spring.datasource.url=jdbc:mysql://localhost:3306/vajra_eye?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Video: webcam index, RTSP URL, or file path. Synthetic demo runs if open fails.
vajra.video.source=0
vajra.camera.id=CAM-LAB-01
vajra.demo.synthetic=true

vajra.model.path=src/main/resources/models/yolov8n.onnx
ai.djl.onnxruntime.deviceType=cpu

vajra.motion.pixel-threshold=25
vajra.motion.min-area=1000
vajra.motion.pan-fraction=0.60
vajra.detect.min-probability=0.20
vajra.alert.cooldown-ms=15000
vajra.alert.key=VajraEyeLabKeyChangeMe!!

# Leave blank for laboratory mode (alerts go to the log only)
twilio.account.sid=
twilio.auth.token=
twilio.phone.number=
vajra.alert.sms.to=
